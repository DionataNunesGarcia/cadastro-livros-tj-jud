services:
  # Container do PHP-FPM (Aqui processa o código PHP/Symfony)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tjjud_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - tjjud_network
    depends_on:
      db:
        condition: service_healthy

  # Container do Nginx (Aqui serve os arquivos estáticos e redireciona requisições para o PHP-FPM)
  web:
    image: nginx:alpine
    container_name: tjjud_web
    restart: unless-stopped
    ports:
      - "8085"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tjjud_network
    depends_on:
      - app

  # Container do MySQL (Aqui é o banco de dados)
  db:
    image: mysql:8.0
    container_name: tjjud_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tjjud_network

networks:
  tjjud_network:
    driver: bridge

volumes:
  db_data:
